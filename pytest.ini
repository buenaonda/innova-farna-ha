[pytest]
asyncio_mode = auto
testpaths = tests
# La raíz del repo debe estar en sys.path para que `custom_components...` importe.
#
# Sin esto, `python -m pytest` funciona (mete el cwd en sys.path) pero el
# ejecutable `pytest` NO — y el CI usa el segundo. Los tests "pasaban" en local
# solo por CÓMO se invocaban, y el job de CI quedaba en rojo con
# ModuleNotFoundError. Con `pythonpath` funciona igual con las dos formas.
pythonpath = .
